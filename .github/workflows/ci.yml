name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest

    strategy:
      matrix:
        rust:
          - stable
          - beta
          - nightly
        exclude:
          - rust: nightly  # Skip nightly for regular testing

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: target

      - name: Build
        run: cargo build --release --workspace --exclude chimera_term_fuzz --lib --bins

      - name: Run tests
        run: cargo test --release --workspace --exclude chimera_term_fuzz --lib --bins --tests

      - name: Compile supported benchmark
        run: cargo bench --bench codegen_bench --no-run

  fuzz:
    name: Fuzzing
    runs-on: ubuntu-latest
    # Only run on nightly for fuzzing
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository.full_name)

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust Nightly
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly
          components: rust-src

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz

      - name: Run fuzzing for parser
        run: |
          timeout 30 cargo fuzz run fuzz_parser -- -max_len=100 || true
        continue-on-error: true

      - name: Run fuzzing for lexer
        run: |
          timeout 30 cargo fuzz run fuzz_lexer -- -max_len=100 || true
        continue-on-error: true

      - name: Run fuzzing for ETF encoding/decoding
        run: |
          timeout 30 cargo fuzz run fuzz_etf -- -max_len=100 || true
        continue-on-error: true

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Check formatting
        run: |
          rustup component add rustfmt
          cargo fmt --all -- --check

  test-ubuntu:
    name: Test on Ubuntu
    runs-on: ubuntu-latest
    container: elixir:1.19.5-otp-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Erlang/OTP
        run: apt-get update && apt-get install -y erlang

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Build and test
        run: |
          cargo build --release --workspace --exclude chimera_term_fuzz --lib --bins
          cargo test --release --workspace --exclude chimera_term_fuzz --lib --bins --tests

  test-macos:
    name: Test on macOS
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Build
        run: cargo build --release --workspace --exclude chimera_term_fuzz --lib --bins

      - name: Run tests
        run: cargo test --release --workspace --exclude chimera_term_fuzz --lib --bins --tests

  test-windows:
    name: Test on Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Build
        run: cargo build --release --workspace --exclude chimera_term_fuzz --lib --bins

      - name: Run tests
        run: cargo test --release --workspace --exclude chimera_term_fuzz --lib --bins --tests
