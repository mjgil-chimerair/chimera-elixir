name: Benchmark

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 0 * * *'  # Daily at midnight

env:
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0

jobs:
  bench:
    name: Benchmark
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: target

      - name: Run benchmarks
        run: cargo bench --all

      - name: Upload benchmarks
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: 'cargo'
          output-file-path: 'benchmark_results.txt'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          show-table: true
          algorithm: percentage
          alert-threshold: '10%'
          comment-on-alert: true