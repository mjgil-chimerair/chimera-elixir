name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0

jobs:
  version-bump:
    name: Bump Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version_bump.outputs.version }}
      tag: ${{ steps.version_bump.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Install cargo-edit
        run: cargo install cargo-edit

      - name: Bump version
        id: version_bump
        run: |
          # Get current version from Cargo.toml
          CURRENT_VERSION=$(grep -m1 '^version =' Cargo.toml | cut -d'"' -f2)
          echo "Current version: $CURRENT_VERSION"
          
          # Parse version components
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"
          
          # Determine what type of bump to do based on commits since last tag
          # For simplicity, we'll do a patch bump for now
          # In a more sophisticated system, you'd analyze commit messages
          NEW_PATCH=$((PATCH + 1))
          NEW_VERSION="$MAJOR.$MINOR.$NEW_PATCH"
          
          # Update Cargo.toml
          cargo set-version $NEW_VERSION
          
          # Also update version in any other places if needed
          # For example, in README or docs
          
          echo "New version: $NEW_VERSION"
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Commit version bump
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add Cargo.toml
          git commit -m "chore(release): bump version to $NEW_VERSION"
          git push

  release:
    name: Release Build
    needs: version-bump
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: target

      - name: Get version
        id: version
        run: echo "VERSION=${{ needs.version-bump.outputs.version }}" >> $GITHUB_OUTPUT

      - name: Generate changelog
        id: changelog
        run: |
          ./scripts/generate-changelog.sh
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          cat CHANGELOG.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Build release
        run: cargo build --release --all-targets

      - name: Run tests
        run: cargo test --release --all

      - name: Create archive
        id: archive
        run: |
          mkdir -p release
          cp target/release/rzx release/
          cp target/release/rzx.exe release/ 2>/dev/null || true
          tar -czf rzx-${{ steps.version.outputs.VERSION }}-x86_64-unknown-linux-gnu.tar.gz release/
          ls -la *.tar.gz

      - name: Sign artifacts
        id: sign
        run: |
          # Install GPG if not present
          sudo apt-get update && sudo apt-get install -y gnupg
          
          # Import the GPG key from secrets (assuming it's set up)
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --import
          
          # Sign each artifact
          for file in *.tar.gz; do
            gpg --armor --detach-sign "$file"
            echo "Signed $file"
          done
          
          # Also sign checksums
          gpg --armor --detach-sign checksums.txt
          echo "Signed checksums.txt"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.version-bump.outputs.tag }}
          name: Release ${{ needs.version-bump.outputs.version }}
          body: ${{ steps.changelog.outputs.changelog }}
          files: |
            *.tar.gz
            *.asc
            checksums.txt
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-homebrew:
    name: Homebrew Release
    needs: release
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Get version
        id: version
        run: echo "VERSION=${{ needs.release.outputs.VERSION }}" >> $GITHUB_OUTPUT

      - name: Build
        run: |
          cargo build --release --bin rzx
          mkdir -p homebrew/rzx/bin
          cp target/release/rzx homebrew/rzx/bin/

      - name: Create Homebrew formula
        run: |
          cd homebrew
          version=$(git describe --tags)
          sed "s/\${VERSION}/$version/g" Formula/rzx.rb.tmpl > Formula/rzx.rb
          cat Formula/rzx.rb

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v5
        with:
          path: homebrew
          branch: rzx-release
          commit-message: "chore(rzx): release version ${{ needs.release.outputs.VERSION }}"