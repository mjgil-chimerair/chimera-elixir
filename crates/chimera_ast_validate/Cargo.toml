[package]
name = "chimera_ast_validate"
version = "0.1.0"
edition = "2021"
description = "AST validation for the Rust/Zig Elixir compiler"

[dependencies]
chimera_ast = { path = "../chimera_ast" }
chimera_term = { path = "../chimera_term" }
chimera_diag = { path = "../chimera_diag" }
chimera_source = { path = "../chimera_source" }

[dev-dependencies]
chimera_allocator = { workspace = true }
criterion = { workspace = true }

[benchmarks]
validation_bench = { harness = false }
